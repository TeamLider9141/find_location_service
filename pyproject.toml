[project]
name = "find-location"
version = "0.1.0"
description = "Telegram bot for a shared database of roadside places kept by drivers."
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.13,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
