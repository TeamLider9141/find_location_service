[project]
name = "find-location"
version = "0.1.0"
description = "Telegram bot for a shared database of roadside places kept by drivers."
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.13,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
]

# Without this, setuptools scans the working tree and refuses to build once
# data/ exists next to app/ — which it always does on a server that has run
# the bot even once.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
