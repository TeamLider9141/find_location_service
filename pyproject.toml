[project]
name = "find-location"
version = "0.1.0"
description = "Provider-agnostic location search pipeline for a driver Telegram bot."
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that call external services",
]

[tool.ruff]
line-length = 100
target-version = "py312"
